name: release

# Builds and publishes libcloseoreui.so for mcpelauncher.
#
# CI exists here for one reason: a release artefact that anyone can trace back to
# public sources compiled on a public runner, rather than a binary someone built
# on their own machine. For a mod that hooks into game memory, that matters.
#
# It is NOT a compatibility check. The runner has no game files, and must not:
# "the workflow passed" only means "it compiles and the ABI surface is what we
# expect", never "it works on your version". Compatibility is reported at runtime
# by the mod's own log.
#
# The repository never handles Minecraft binaries. Only the mod's own .so is
# built and uploaded.

on:
  workflow_dispatch:
    inputs:
      tested_with:
        description: 'Minecraft version tested against (optional, release notes only)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(git describe --tags --always 2>/dev/null | sed 's/^v//' || echo dev)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Resolve toolchain
        id: toolchain
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-}"
          if [[ -z "$NDK" || ! -d "$NDK" ]]; then
            echo "ANDROID_NDK_HOME is not set on this runner" >&2
            exit 1
          fi
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $NDK"
          cat "$NDK/source.properties" 2>/dev/null || true

      - name: Host tests
        run: ./tests/run_tests.sh

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.toolchain.outputs.ndk }}
          MOD_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/build.sh

      - name: Verify artefact
        env:
          ANDROID_NDK_HOME: ${{ steps.toolchain.outputs.ndk }}
        run: |
          set -euo pipefail
          SO=build/x86_64/libcloseoreui.so
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "== mod ABI entry points =="
          "$BIN/llvm-nm" -D --defined-only "$SO" | tee symbols.txt
          grep -q ' T mod_init$' symbols.txt
          grep -q ' T mod_preinit$' symbols.txt

          echo "== dependencies (launcher and game provided only) =="
          "$BIN/llvm-readelf" -d "$SO" | grep NEEDED

          echo "== version label recorded in the binary =="
          strings "$SO" | grep -F "${{ steps.meta.outputs.version }}" \
            || { echo "version label missing from the binary" >&2; exit 1; }

      - name: Package
        id: package
        run: |
          set -euo pipefail
          ./scripts/package.sh "${{ steps.meta.outputs.version }}" dist
          echo "name=$(ls dist/*.tar.gz | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: closeoreui-x86_64
          path: dist/*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_WITH: ${{ inputs.tested_with }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          ARCHIVE="$(ls dist/*.tar.gz | head -1)"

          {
            echo "closeoreui ${VERSION}，mcpelauncher / Linux x86_64。"
            echo
            if [[ -n "${TESTED_WITH:-}" ]]; then
              echo "已验证的 Minecraft 版本：\`${TESTED_WITH}\`。"
              echo
              echo "模组不绑定该版本：目标函数在启动时按结构定位，通常可跨 patch 版本工作。"
              echo
            fi
            echo "安装：把 \`libcloseoreui.so\` 放进 mcpelauncher 的 \`mods/\` 目录。"
            echo
            echo "本 release 只包含模组本身，不含任何 Minecraft 文件，构建过程也不需要它们。"
            echo "许可：AGPL-3.0，发布包内附全文。"
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
            gh release edit "$TAG" \
              --title "closeoreui ${VERSION}" \
              --notes-file notes.md
          else
            gh release create "$TAG" "$ARCHIVE" \
              --title "closeoreui ${VERSION}" \
              --notes-file notes.md
          fi
