name: release

# Builds and publishes libcloseoreui.so for mcpelauncher.
#
# CI exists here for one reason: a release artefact that anyone can trace back to
# public sources compiled on a public runner, rather than a binary someone built
# on their own machine. For a mod that hooks into game memory, that matters.
#
# It is NOT a compatibility check. The runner has no game files — and must not —
# so "the workflow passed" only means "it compiles and the ABI surface is what we
# expect", never "it works on your version". Compatibility is reported at runtime
# by the mod's own log.
#
# The repository never handles Minecraft binaries. Only the mod's own .so is
# built and uploaded.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tested_with:
        description: 'Minecraft version this build was verified against (optional, release notes only)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs tags

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Manual run: fall back to git describe, stripping the leading v.
            VERSION="$(git describe --tags --always 2>/dev/null | sed 's/^v//' || echo dev)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Resolve toolchain
        id: toolchain
        run: |
          set -euo pipefail
          # Pin the NDK rather than following ANDROID_NDK_LATEST_HOME: the runner
          # image moves to a new NDK whenever ubuntu-latest is bumped, which would
          # silently change the compiler behind an otherwise identical release.
          NDK="${ANDROID_NDK_HOME:-}"
          if [[ -z "$NDK" || ! -d "$NDK" ]]; then
            echo "ANDROID_NDK_HOME is not set on this runner" >&2
            exit 1
          fi
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $NDK"
          cat "$NDK/source.properties" 2>/dev/null || true

      - name: Host tests
        run: ./tests/run_tests.sh

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.toolchain.outputs.ndk }}
          MOD_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/build.sh

      - name: Verify artefact
        env:
          ANDROID_NDK_HOME: ${{ steps.toolchain.outputs.ndk }}
        run: |
          set -euo pipefail
          SO=build/x86_64/libcloseoreui.so
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo "== mod ABI entry points =="
          "$NM" -D --defined-only "$SO" | tee symbols.txt
          grep -q ' T mod_init$' symbols.txt
          grep -q ' T mod_preinit$' symbols.txt

          echo "== dependencies (must be launcher/game provided only) =="
          "$READELF" -d "$SO" | grep NEEDED

          echo "== version label recorded in the binary =="
          strings "$SO" | grep -F "${{ steps.meta.outputs.version }}" \
            || { echo "version label missing from the binary" >&2; exit 1; }

      - name: Package
        run: |
          set -euo pipefail
          NAME="closeoreui-${{ steps.meta.outputs.version }}-linux-x86_64"
          mkdir -p dist
          cp build/x86_64/libcloseoreui.so dist/
          cat > dist/README.txt <<'EOF'
CloseOreUI — 关闭 Minecraft 基岩版 OreUI 的 mcpelauncher 模组
=============================================================

安装
----
把 libcloseoreui.so 放到 mcpelauncher 的 mods 目录：

  原生:    ~/.local/share/mcpelauncher/mods/
  Flatpak: ~/.var/app/io.mrarm.mcpelauncher/data/mcpelauncher/mods/

启动游戏后会自动在同级 CloseOreUI/config.json 生成配置。
想确认是否生效，可设 CLOSEOREUI_DEBUG=1 查看日志中的
"OreUI config function at ..." 与 "screens patched" 两行。

本模组不绑定特定游戏版本：目标函数在启动时按结构定位。
但行为层依赖一定的内存布局，若某版本失效，日志会给出明确原因。

本包只包含模组本身，不含任何 Minecraft 文件。
源码与许可（AGPL-3.0）见项目仓库。
EOF
          ( cd dist && sha256sum libcloseoreui.so > SHA256SUMS.txt )
          tar -czf "dist/${NAME}.tar.gz" -C dist libcloseoreui.so README.txt SHA256SUMS.txt
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: closeoreui-x86_64
          path: dist/*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_WITH: ${{ inputs.tested_with }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.meta.outputs.version }}"

          if [[ -n "${TESTED_WITH:-}" ]]; then
            COMPAT="已验证的 Minecraft 版本：\`${TESTED_WITH}\`。

模组不绑定该版本——目标函数在启动时按结构定位，通常可跨 patch 版本工作。
"
          else
            COMPAT=""
          fi

          cat > notes.md <<EOF
closeoreui ${{ steps.meta.outputs.version }}，mcpelauncher / Linux x86_64。

${COMPAT}
安装：把 \`libcloseoreui.so\` 放进 mcpelauncher 的 \`mods/\` 目录。

本 release 只包含模组本身，不含任何 Minecraft 文件，构建过程也不需要它们。
EOF

          # Create, or update the assets if the tag already has a release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/${{ env.NAME }}.tar.gz" --clobber
            gh release edit "$TAG" --title "closeoreui ${{ steps.meta.outputs.version }}" --notes-file notes.md
          else
            gh release create "$TAG" "dist/${{ env.NAME }}.tar.gz" \
              --title "closeoreui ${{ steps.meta.outputs.version }}" \
              --notes-file notes.md
          fi
